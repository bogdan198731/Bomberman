name: CI

on:
  pull_request:
  push:
    branches: [main]

# Fix branches carry model-written tests, so the job gets a read-only token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Browser tests of what players see; Chromium only, as the fix pipeline uses.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
