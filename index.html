<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bomberman</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      color: #fff;
      background: #181818;
      font-family: system-ui, sans-serif;
    }
    #gameCanvas {
      display: block;
      width: min(832px, calc(100vw - 48px), calc(100vh - 150px));
      height: auto;
      border: 3px solid #eee;
      border-radius: 4px;
      background-color: #000;
      image-rendering: pixelated;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    .container {
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      letter-spacing: 0.08em;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin: 0 0 16px;
      color: #ddd;
      font-size: 0.95rem;
    }
    .player-one strong {
      color: #00ff00;
    }
    .player-two strong {
      color: #ff5555;
    }
    kbd {
      padding: 2px 6px;
      border: 1px solid #777;
      border-radius: 3px;
      color: #fff;
      background: #333;
      box-shadow: 0 1px 0 #777;
      font: inherit;
    }
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      #gameCanvas {
        width: min(calc(100vw - 24px), calc(100vh - 190px));
      }
      .controls {
        flex-direction: column;
        gap: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bomberman</h1>
    <div class="controls" aria-label="Game controls">
      <span class="player-one"><strong>Player 1</strong>: <kbd>WASD</kbd> + <kbd>Space</kbd></span>
      <span class="player-two"><strong>Player 2</strong>: <kbd>Arrows</kbd> + <kbd>Enter</kbd></span>
    </div>
    <canvas
      id="gameCanvas"
      width="832"
      height="832"
      aria-label="Two-player Bomberman game board"
    ></canvas>
  </div>
  <script type="module" src="./dist/index.js"></script>
</body>
</html>
